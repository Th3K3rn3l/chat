<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чат</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #16181d; --line: #262a32;
    --text: #e7e9ee; --muted: #949aa7;
    --accent: #6c8cff; --accent-dim: #33406b;
  }
  [data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb;
    --text: #14171c; --muted: #6b7280;
    --accent: #3b5bdb; --accent-dim: #dbe3ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header .title { font-weight: 600; font-size: 14px; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  select, button { font: inherit; color: inherit; }
  select {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 6px 8px; border-radius: 8px; font-size: 13px; max-width: 46vw;
  }
  .icon-btn {
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--muted);
  }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 18px 14px 8px; scroll-behavior: smooth; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; }
  .msg .avatar {
    width: 26px; height: 26px; border-radius: 7px; flex: 0 0 26px; margin-top: 2px;
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
  }
  .msg.user .avatar { background: var(--accent-dim); color: var(--accent); }
  .msg.bot .avatar { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .msg .body { min-width: 0; flex: 1; }
  .msg .role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 3px; }
  .msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .text p { margin: 0 0 10px; }
  .msg .text p:last-child { margin-bottom: 0; }
  .msg .text pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; overflow-x: auto; margin: 10px 0; font-size: 13px;
  }
  .msg .text code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
  .msg .text :not(pre) > code {
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  }
  .msg .text a { color: var(--accent); }
  .msg .text ul, .msg .text ol { margin: 8px 0; padding-left: 22px; }
  .cursor::after {
    content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .err { color: #ff7a7a; font-size: 13px; }
  footer {
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .composer {
    max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 8px 10px;
  }
  .composer:focus-within { border-color: var(--accent-dim); }
  textarea {
    flex: 1; background: transparent; border: 0; outline: 0; resize: none;
    color: var(--text); font: inherit; max-height: 180px; padding: 6px 2px;
  }
  textarea::placeholder { color: var(--muted); }
  #send {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  #send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 11px; text-align: center; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 14px; }

  #gate {
    position: fixed; inset: 0; z-index: 50; display: none;
    place-items: center; background: var(--bg);
  }
  #gate.on { display: grid; }
  #gate form {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 26px; width: min(92vw, 340px); display: flex; flex-direction: column; gap: 12px;
  }
  #gate h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  #gate input {
    font: inherit; padding: 10px 12px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--line); color: inherit; outline: 0;
  }
  #gate input:focus { border-color: var(--accent-dim); }
  #gate button {
    font: inherit; padding: 10px 12px; border-radius: 10px;
    background: var(--accent); color: #fff; border: 0; font-weight: 600; cursor: pointer;
  }
  #gate .err { min-height: 18px; }

  @media (max-width: 560px) {
    #log { padding: 12px 10px 4px; }
    header { padding: 8px 10px; }
    footer { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <span class="title">Чат</span>
  <span class="spacer"></span>
  <select id="model" title="Модель"></select>
  <button class="icon-btn" id="theme" title="Тема">◐</button>
  <button class="icon-btn" id="clear" title="Очистить">Очистить</button>
  <button class="icon-btn" id="logout" title="Выйти">Выйти</button>
</header>

<div id="log"><div class="wrap" id="wrap"></div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Спросите что-нибудь…" autofocus></textarea>
    <button id="send">Отправить</button>
  </div>
  <div class="hint">Enter — отправить, Shift+Enter — новая строка</div>
</footer>

<div id="gate">
  <form id="gate-form">
    <h1>Доступ к чату</h1>
    <input id="gate-pass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button type="submit">Войти</button>
    <div class="err" id="gate-err"></div>
  </form>
</div>

<script>
// Адрес серверной части.
// Вставьте ссылку на свою функцию из консоли Yandex Cloud (вид: https://functions.yandexcloud.net/xxxxxxxx).
const CHAT_URL = 'https://functions.yandexcloud.net/d4eftetn87pksb7tibtj';
const CONFIG_URL = CHAT_URL;   // тот же адрес, GET отдаёт список моделей

const logEl = document.getElementById('log');
const wrap = document.getElementById('wrap');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelSel = document.getElementById('model');
const gate = document.getElementById('gate');
const gateErr = document.getElementById('gate-err');

let history = [];
let busy = false;
let controller = null;
let password = localStorage.getItem('chat_pass') || '';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

function authHeaders(extra) {
  return Object.assign({ 'X-Chat-Password': password }, extra || {});
}

function openGate(msg) {
  gate.classList.add('on');
  gateErr.textContent = msg || '';
  document.getElementById('gate-pass').value = '';
  setTimeout(() => document.getElementById('gate-pass').focus(), 50);
}

document.getElementById('gate-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  gateErr.textContent = '';
  const val = document.getElementById('gate-pass').value;
  try {
    const res = await fetch(CONFIG_URL, { headers: { 'X-Chat-Password': val } });
    if (res.status === 401) { gateErr.textContent = 'Неверный пароль'; return; }
    if (!res.ok) { gateErr.textContent = 'Сервер вернул ' + res.status; return; }
    password = val;
    localStorage.setItem('chat_pass', val);
    gate.classList.remove('on');
    await boot();
  } catch (err) {
    gateErr.textContent = 'Сервер недоступен из этой сети';
  }
});

document.getElementById('logout').addEventListener('click', () => {
  password = '';
  localStorage.removeItem('chat_pass');
  history = [];
  store.set('chat_history', []);
  renderAll();
  openGate();
});

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function md(src) {
  const blocks = [];
  let s = esc(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  s = s.replace(/^## (.+)$/gm, '<strong>$1</strong>');
  s = s.replace(/^# (.+)$/gm, '<strong>$1</strong>');
  const out = [];
  let list = null;
  for (const line of s.split('\n')) {
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const type = ul ? 'ul' : 'ol';
      if (list !== type) { if (list) out.push('</' + list + '>'); out.push('<' + type + '>'); list = type; }
      out.push('<li>' + (ul ? ul[1] : ol[1]) + '</li>');
      continue;
    }
    if (list) { out.push('</' + list + '>'); list = null; }
    out.push(line);
  }
  if (list) out.push('</' + list + '>');
  s = out.join('\n');
  s = s.split(/\n{2,}/).map(p => {
    const t = p.trim();
    if (t.startsWith('<') || /^\u0000\d+\u0000$/.test(t)) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i] || '');
  return s;
}

function scroll() { logEl.scrollTop = logEl.scrollHeight; }

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  el.innerHTML = '<div class="avatar">' + (role === 'user' ? 'Я' : 'AI') + '</div>' +
    '<div class="body"><div class="role">' + (role === 'user' ? 'Вы' : 'Ассистент') + '</div>' +
    '<div class="text"></div></div>';
  const txt = el.querySelector('.text');
  if (role === 'user') txt.textContent = text; else txt.innerHTML = md(text);
  wrap.appendChild(el);
  scroll();
  return txt;
}

function renderAll() {
  wrap.innerHTML = '';
  if (!history.length) {
    wrap.innerHTML = '<div class="empty">Просто спросите — ответ придёт сюда.</div>';
    return;
  }
  for (const m of history) addMsg(m.role, m.content);
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  sendBtn.textContent = v ? 'Стоп' : 'Отправить';
}

async function send() {
  if (busy) { if (controller) controller.abort(); return; }
  const text = input.value.trim();
  if (!text) return;

  const emptyEl = wrap.querySelector('.empty');
  if (emptyEl) emptyEl.remove();

  history.push({ role: 'user', content: text });
  store.set('chat_history', history);
  input.value = '';
  input.style.height = 'auto';
  addMsg('user', text);

  const out = addMsg('assistant', '');
  out.classList.add('cursor');
  setBusy(true);
  controller = new AbortController();

  let acc = '';
  try {
    const res = await fetch(CHAT_URL, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ messages: history.slice(-20), model: modelSel.value }),
      signal: controller.signal
    });

    if (res.status === 401) {
      out.classList.remove('cursor');
      setBusy(false);
      openGate('Пароль больше не подходит');
      return;
    }
    if (!res.ok) {
      let msg = 'Ошибка сервера: ' + res.status;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
      out.innerHTML = '<span class="err"></span>';
      out.firstChild.textContent = msg;
      return;
    }

    const ctype = res.headers.get('content-type') || '';

    if (ctype.includes('application/json')) {
      // Функция Яндекса отдаёт ответ целиком, без потока
      const data = await res.json();
      acc = data.content || '';
      out.innerHTML = md(acc);
      scroll();
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          const line = part.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          let ev;
          try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
          if (ev.delta) { acc += ev.delta; out.innerHTML = md(acc); scroll(); }
          if (ev.error) { acc += '\n\n⚠️ ' + ev.error; out.innerHTML = md(acc); }
        }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      acc += (acc ? '\n\n' : '') + '⚠️ Сервер недоступен из этой сети';
    }
  } finally {
    out.classList.remove('cursor');
    setBusy(false);
    controller = null;
    if (acc) {
      history.push({ role: 'assistant', content: acc });
      store.set('chat_history', history);
    }
    out.innerHTML = md(acc || '…');
    scroll();
  }
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);
document.getElementById('clear').addEventListener('click', () => {
  if (busy) return;
  history = [];
  store.set('chat_history', history);
  renderAll();
});
document.getElementById('theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', cur);
  store.set('chat_theme', cur);
});

async function boot() {
  history = store.get('chat_history', []);
  renderAll();

  try {
    const res = await fetch(CONFIG_URL, { headers: authHeaders() });
    if (res.status === 401) { openGate('Пароль больше не подходит'); return; }
    const cfg = await res.json();
    modelSel.innerHTML = '';
    for (const m of cfg.models) {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      modelSel.appendChild(o);
    }
    const saved = store.get('chat_model', cfg.default_model);
    modelSel.value = cfg.models.includes(saved) ? saved : cfg.default_model;
  } catch {
    wrap.innerHTML = '<div class="empty">Сервер чата недоступен из этой сети.</div>';
  }
}

(function init() {
  document.documentElement.setAttribute('data-theme', store.get('chat_theme', 'dark'));
  modelSel.addEventListener('change', () => store.set('chat_model', modelSel.value));
  if (password) boot(); else openGate();
})();
</script>
</body>
</html>
